# SonarQube Cloud project configuration
# https://sonarcloud.io/project/overview?id=Nick2bad4u_gh-secret-sync

sonar.projectKey=Nick2bad4u_gh-secret-sync
sonar.projectName=gh-secret-sync
sonar.organization=nick2bad4u

# Source and test directories
sonar.sources=src
sonar.tests=test

# TypeScript tsconfig (root config only, avoiding generated/nested configs)
sonar.typescript.tsconfigPaths=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions for generated output, dependencies, cache, and bridge stubs
sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  .cache/**,\
  coverage/**,\
  temp/**,\
  docs/**,\
  scripts/**,\
  src/*.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/*.d.mts,\
  **/*.d.ts

# Coverage produced by Vitest's V8 provider
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Duplication exclusions
sonar.cpd.exclusions=\
  src/*.js,\
  dist/**,\
  docs/**
